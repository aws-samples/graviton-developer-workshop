apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-mcp-server
  namespace: trading
  labels:
    app: trading-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-mcp-server
  template:
    metadata:
      labels:
        app: trading-mcp-server
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: trading-mcp-server
          image: ${ECR_REPO}/trading-mcp-server:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trading-mcp-server
  namespace: trading
spec:
  selector:
    app: trading-mcp-server
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
