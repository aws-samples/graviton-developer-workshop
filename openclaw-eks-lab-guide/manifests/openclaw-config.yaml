apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw-agents
data:
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": {
            "primary": "bedrock/global.anthropic.claude-sonnet-4-6"
          }
        }
      },
      "gateway": {
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        }
      }
    }
