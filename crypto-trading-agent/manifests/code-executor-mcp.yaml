apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-executor-mcp-sa
  namespace: trading
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-claim-creator
  namespace: trading
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-executor-sandbox-claim
  namespace: trading
subjects:
  - kind: ServiceAccount
    name: code-executor-mcp-sa
    namespace: trading
roleRef:
  kind: Role
  name: sandbox-claim-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-executor-mcp
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-executor-mcp
  template:
    metadata:
      labels:
        app: code-executor-mcp
    spec:
      serviceAccountName: code-executor-mcp-sa
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: code-executor-mcp
          image: ${ECR_REPO}/code-executor-mcp:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SANDBOX_WARMPOOL
              value: "trading-python-pool"
            - name: SANDBOX_NAMESPACE
              value: "trading"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: code-executor-mcp
  namespace: trading
spec:
  selector:
    app: code-executor-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
