apiVersion: apps/v1
kind: Deployment
metadata:
  name: strands-trading-agent
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: strands-trading-agent
  template:
    metadata:
      labels:
        app: strands-trading-agent
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: trading-agent
          image: ${ECR_REPO}/strands-trading-agent:latest
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: MODEL_ID
              value: "global.anthropic.claude-sonnet-4-6"
            - name: LLM_ENDPOINT
              value: "http://agentgateway.gateway.svc.cluster.local:8080/v1"
            - name: MCP_ENDPOINT
              value: "http://agentgateway.gateway.svc.cluster.local:8081/mcp"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: COGNITO_USER_POOL_ID
              value: "${USER_POOL_ID}"
            - name: COGNITO_CLIENT_ID
              value: "${APP_CLIENT_ID}"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: strands-trading-agent
  namespace: trading
spec:
  selector:
    app: strands-trading-agent
  ports:
    - name: http
      port: 80
      targetPort: 8501
  type: ClusterIP
